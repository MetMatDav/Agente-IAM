# mypy (Fase 13): comprueba las anotaciones de tipo sin ejecutar el codigo.
# Modo poco estricto a proposito: las librerias sin tipos (strands, boto3)
# cuentan como Any. Se endurece por pasos, no de golpe. Lo corre
# scripts/pruebas.sh unitarios.
#
# Paso 1 (24-10-2026, revision O7): las cinco opciones de abajo daban 0
# errores ese dia con mypy 2.4.0, sin tocar codigo. check_untyped_defs hace
# que tambien se revise el cuerpo de las funciones sin anotar. Los pasos
# siguientes (disallow_incomplete_defs, warn_return_any, disallow_untyped_defs)
# piden editar codigo y quedan para despues.
[mypy]
python_version = 3.12
files = agente_iam, main.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_unused_configs = True
check_untyped_defs = True
warn_unreachable = True
warn_redundant_casts = True
no_implicit_optional = True
