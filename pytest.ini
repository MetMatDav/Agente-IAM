# Tres tipos de tests, uno por carpeta de tests/ (Fase 11, PLAN-CORRECCIONES).
# La carpeta manda: tests/conftest.py pone a cada test el marcador de su
# carpeta, nadie lo escribe a mano. Comandos por tipo: scripts/pruebas.sh.
[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    unitarios: sin red ni credenciales; cada pieza con dobles (Stubber, monkeypatch)
    seguridad: los controles que impiden conceder de mas, y el repo sin secretos
    funcionales: contra la cuenta AWS real; solo corren con la puerta abierta (tests/puerta.py)
    bedrock: llama al modelo y cuesta dinero; se excluye con -m "not bedrock"
